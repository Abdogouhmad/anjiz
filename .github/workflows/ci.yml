name: ci

# Quality gate for every pull request and every push to `main`:
#   quality  — formatting + static analysis (seconds)
#   test     — the app and design-system suites
#   android  — a debug APK smoke build, so a broken Android/Glance change is
#              caught here rather than by the release workflow on `main`
#
# The release workflow (release.yml) builds the real, signed APKs.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer commit on the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output none --set-exit-if-changed .

      - name: Analyze (workspace + design system)
        run: flutter analyze

  test:
    name: Test suites
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run app tests
        run: flutter test

      - name: Run design-system tests
        run: cd packages/anjiz_ui && flutter test

  android:
    name: Debug APK smoke build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # A debug build needs no signing secrets and still compiles every Kotlin
      # source, the Glance widgets and the merged manifest.
      - name: Build debug APK
        run: flutter build apk --debug
