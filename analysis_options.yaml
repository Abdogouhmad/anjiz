include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - build/**
    - android/**
    - linux/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    sort_child_properties_last: true
    use_super_parameters: true
    avoid_print: true
    require_trailing_commas: true
    # Use cases take named, prefixed constructor parameters (e.g. `tasks`) that
    # are assigned to private fields (`_tasks`) for dependency-injection
    # readability; `this._tasks` is not valid for named parameters.
    prefer_initializing_formals: false
