name: anjiz
description: "Anjiz (أنجِز) — an offline-first, Material 3 Expressive to-do app with Android home-screen widgets."
publish_to: "none"
version: 0.1.1+1
environment:
  sdk: ^3.13.0

workspace:
  - packages/anjiz_ui

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  anjiz_ui:
    path: packages/anjiz_ui
  image_picker: ^1.1.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^14.8.1
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  characters: ^1.3.0
  collection: ^1.19.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  home_widget: ^0.8.0
  workmanager: ^0.9.0
  shared_preferences: ^2.3.0
  http: ^1.6.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.28.0
  riverpod_generator: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

# Adaptive launcher icon: background + foreground + Android 13 monochrome layer
# rasterised from `assets/icons/ic_launcher*.xml`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/ic_playstore_512.png
  adaptive_icon_background: assets/icon/ic_background.png
  adaptive_icon_foreground: assets/icon/ic_foreground.png
  adaptive_icon_monochrome: assets/icon/ic_monochrome.png
  # The layers already leave the icon's safe-zone margin, so no extra inset.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
