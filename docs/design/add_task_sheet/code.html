mary-container"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-6 px-6 flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm select-none"><span class="font-medium tracking-tight">9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div><div class="h-16 px-3 flex items-center justify-between"><div class="flex items-center gap-2"><button aria-label="Navigate Back" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[24px] rtl:rotate-180">arrow_back</span></button><h1 class="font-title-lg text-title-lg text-on-surface tracking-tight truncate">Create Task</h1></div><div class="flex items-center gap-2"><button aria-label="More options" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all"><span class="material-symbols-outlined text-[22px]">more_vert</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-4 pt-22 pb-8 bg-surface min-h-screen"><div class="flex flex-col w-full relative">

<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">Wednesday, 24 Oct</span>
<span class="font-headline-md text-headline-md text-on-surface">Today's Focus</span>
</div>
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[24px]">calendar_today</span>
</div>
</div>
<!-- Background Task Item 1 -->
<div class="bg-surface-container-low p-4 rounded-lg flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full bg-surface-container-highest"></div>

<span class="font-title-sm text-title-sm text-on-surface">Review design sprint tokens</span>
<span class="font-body-md text-body-md text-on-surface-variant">Design System • 10:30 AM</span>
</div>
</div>
<span class="material-symbols-outlined text-outline">more_vert</span>
</div>
<!-- Background Task Item 2 -->
<div class="bg-surface-container-low p-4 rounded-lg flex items-center justify-between">

<div class="w-6 h-6 rounded-full bg-surface-container-highest"></div>

</div>

</div>

<div class="flex flex-col w-full mb-3">

<div class="flex flex-col gap-1.5 mb-4">

<span>Next week</span>
</button>
<!-- Pick Date Segment -->

<span class="material-symbols-outlined text-[16px]">edit_calendar</span>
<span class="sr-only">Pick date</span>

</div>
</div>
<!-- Chip Carousel / Flow Row -->

<button class="h-9 px-3.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface flex items-center gap-1.5 active:scale-95 transition-all shrink-0">

<span class="font-label-md text-label-md font-medium">Inbox</span>

<!-- Priority Chip (Warm Amber Tertiary) -->

<!-- Repeat Chip -->
<button class="h-9 px-3.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface flex items-center gap-1.5 active:scale-95 transition-all shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">repeat</span>
<span class="font-label-md text-label-md font-medium">No repeat</span>
</button>
<!-- Reminder Chip -->
<button class="h-9 px-3.5 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface flex items-center gap-1.5 active:scale-95 transition-all shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">notifications</span>
<span class="font-label-md text-label-md font-medium">15m before</span>

</div>
</div>
<!-- Action Footer -->
<div class="flex items-center gap-2 pt-2 border-t-0">

<button aria-label="Add Voice Note" class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant active:scale-90 transition-all flex items-center justify-center shrink-0">

</button>
<!-- Tonal Secondary: Add Another -->
<button class="h-12 px-4 rounded-full bg-secondary-container hover:bg-secondary-fixed text-on-secondary-container font-label-lg text-label-lg flex items-center justify-center gap-1 active:scale-95 transition-all shrink-0">
<span class="material-symbols-outlined text-[18px]">post_add</span>
<span>Add Another</span>
</button>
<!-- Primary Filled Button: Add Task -->
<button class="h-12 flex-1 rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all duration-150" id="add-task-btn">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Add Task</span>
</button>
</div>
</div>
</div>
<script>
  // Simple micro-interaction for primary button spring press
  const addBtn = document.getElementById('add-task-btn');
  if (addBtn) {
    addBtn.addEventListener('click', function() {
      this.classList.add('scale-95');
      setTimeout(() => {
        this.classList.remove('scale-95');
      }, 150);
    });
  }
</script></main><footer class="fixed bottom-0 w-full z-50 pointer-events-none pb-safe"><div class="w-full flex justify-center py-2"><div class="w-28 h-1 rounded-full bg-on-surface-variant/40"></div></div></footer></body></html>
